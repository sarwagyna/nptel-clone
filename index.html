<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Courses | NPTEL</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <script src="assets/js/layout.js" data-part="header"></script>

  <main class="flex-grow-1 pb-5">
    <div class="container pt-4">

      <!-- Title + view toggle -->
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="page-title"><i class="bi bi-book"></i> My Courses</h1>
        <div class="btn-group view-toggle" role="group" aria-label="Course view">
          <button type="button" class="btn btn-sm btn-outline-secondary active" id="viewList" aria-label="List view" title="List view"><i class="bi bi-list-ul"></i></button>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="viewGrid" aria-label="Grid view" title="Grid view"><i class="bi bi-grid-3x3-gap"></i></button>
        </div>
      </div>

      <!-- Filters -->
      <form class="filter-bar d-flex flex-wrap align-items-end gap-2" id="filterForm" style="margin-top:3.1rem">
        <div>
          <label for="fSemester" class="form-label d-block">Semester</label>
          <select class="form-select form-select-sm" id="fSemester" style="width:129px">
            <option value="all">All Semesters</option>
          </select>
        </div>
        <div>
          <label for="fYear" class="form-label d-block">Year</label>
          <select class="form-select form-select-sm" id="fYear" style="width:98px">
            <option value="all">All Years</option>
          </select>
        </div>
        <div>
          <label for="fStatus" class="form-label d-block">Status</label>
          <select class="form-select form-select-sm" id="fStatus" style="width:170px">
            <option value="all">All Statuses</option>
          </select>
        </div>
        <button type="submit" class="btn btn-sm btn-nptel fw-semibold"><i class="bi bi-funnel me-1"></i>Filter</button>
      </form>

      <!-- Current courses -->
      <section style="margin-top:2.45rem">
        <h2 class="section-title section-current mb-3">
          <i class="bi bi-play-circle"></i> Current Courses
          <span class="badge bg-success count" id="currentCount">0</span>
        </h2>
        <div id="currentList"></div>
      </section>

      <!-- Past courses -->
      <section style="margin-top:2.4rem">
        <h2 class="section-title section-past mb-3">
          <i class="bi bi-check-circle"></i> Past Courses
          <span class="badge bg-secondary count" id="pastCount">0</span>
        </h2>
        <div id="pastList"></div>
      </section>

    </div>
  </main>

  <script src="assets/js/layout.js" data-part="footer"></script>
  <script src="assets/js/layout.js" data-part="report"></script>

  <script src="assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/courses.js"></script>
</body>
</html>
