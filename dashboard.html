<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dashboard | NPTEL</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <script src="assets/js/layout.js" data-part="header"></script>

  <main class="flex-grow-1 dash-main">
    <div class="container pt-4">

      <h1 class="page-title page-title-lg mb-4"><i class="bi bi-speedometer2"></i> My Dashboard</h1>

      <!-- Summary tiles -->
      <div class="row g-4 stat-row">
        <div class="col-sm-6 col-lg-3">
          <div class="card border-0 shadow-sm stat-card stat-courses">
            <div class="card-body">
              <div>
                <div class="stat-label">Total Courses</div>
                <div class="stat-value" id="statTotal">0</div>
              </div>
              <i class="bi bi-book stat-icon" aria-hidden="true"></i>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card border-0 shadow-sm stat-card stat-certs">
            <div class="card-body">
              <div>
                <div class="stat-label">Certificates</div>
                <div class="stat-value" id="statCerts">0</div>
              </div>
              <i class="bi bi-award stat-icon" aria-hidden="true"></i>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card border-0 shadow-sm stat-card stat-active">
            <div class="card-body">
              <div>
                <div class="stat-label">Active Enrollments</div>
                <div class="stat-value" id="statActive">0</div>
              </div>
              <i class="bi bi-clipboard-check stat-icon" aria-hidden="true"></i>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card border-0 shadow-sm stat-card stat-pending">
            <div class="card-body">
              <div>
                <div class="stat-label">Pending Exams</div>
                <div class="stat-value" id="statPending">0</div>
              </div>
              <i class="bi bi-pencil-square stat-icon" aria-hidden="true"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <!-- Recent activity -->
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm dash-card">
            <div class="card-header dash-head dash-head-nptel"><i class="bi bi-clock-history"></i> Recent Activity</div>
            <div class="card-body p-3">
              <div class="list-group list-group-flush" id="recentList"></div>
            </div>
            <div class="card-footer bg-light">
              <a class="btn btn-sm btn-outline-primary" href="index.html">View All Courses &rarr;</a>
            </div>
          </div>
        </div>

        <!-- Side column -->
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm dash-card mb-3">
            <div class="card-header dash-head dash-head-success"><i class="bi bi-award"></i> Quick Actions</div>
            <div class="card-body p-3">
              <div class="d-grid gap-2">
                <a class="btn btn-outline-success" href="verify/NOC-ARF7-36RY-DHWFZ/credential.pdf" download><i class="bi bi-download"></i> Download Certificates</a>
                <a class="btn btn-outline-warning" href="#"><i class="bi bi-trophy"></i> My Achievements</a>
                <a class="btn btn-outline-primary" href="#"><i class="bi bi-graph-up"></i> My Analytics</a>
                <a class="btn btn-outline-secondary" href="#"><i class="bi bi-person"></i> My Profile</a>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm dash-card">
            <div class="card-header dash-head dash-head-warning"><i class="bi bi-exclamation-triangle"></i> Upcoming Deadlines</div>
            <div class="card-body p-4 text-center text-muted" id="deadlines">No upcoming deadlines</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="assets/js/layout.js" data-part="footer"></script>
  <script src="assets/js/layout.js" data-part="report"></script>

  <script src="assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
